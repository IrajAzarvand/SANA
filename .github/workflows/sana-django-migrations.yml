name: SANA Django checks

on:
  pull_request:
    paths:
      - "sana-backend/**"
      - "scripts/reset_sana_db.sh"
      - ".github/workflows/sana-django-migrations.yml"
  push:
    branches: [main]
    paths:
      - "sana-backend/**"
      - "scripts/reset_sana_db.sh"
      - ".github/workflows/sana-django-migrations.yml"

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sana_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sana-backend
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: sana_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TRACCAR_API_URL: http://127.0.0.1:8082/api
      TRACCAR_API_USERNAME: ci
      TRACCAR_API_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sana-backend/requirements-production.lock
      - name: Install GIS and PostgreSQL system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev postgresql-client-16
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.lock
      - name: Enable PostGIS
        run: psql -h 127.0.0.1 -U postgres -d sana_ci -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;"
        env:
          PGPASSWORD: postgres
      - name: Apply migrations to a clean database
        run: python manage.py migrate --noinput
      - name: Check model and migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run contract lifecycle regression tests
        run: python manage.py test fleet.test_contract_integrity_constraints --verbosity 2
      - name: Run Django tests
        run: python manage.py test --verbosity 2
