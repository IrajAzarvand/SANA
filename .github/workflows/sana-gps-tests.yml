name: SANA GPS tests

on:
  pull_request:
    paths:
      - "sana-gps/**"
      - ".github/workflows/sana-gps-tests.yml"
  push:
    branches:
      - "fix/gps-stages-1-3-telemetry-compliance"
    paths:
      - "sana-gps/**"
      - ".github/workflows/sana-gps-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sana_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sana-gps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sana-gps/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create representative SANA business tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -c "
          CREATE TABLE public.fleet_device (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            imei VARCHAR(20) UNIQUE,
            sim_number VARCHAR(20) DEFAULT '',
            management_status VARCHAR(20),
            protocol VARCHAR(50),
            device_model_id BIGINT,
            created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
          );
          CREATE TABLE public.fleet_gpstelemetry (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            device_id BIGINT
          );
          CREATE TABLE public.fleet_devicemodel (
            id BIGINT PRIMARY KEY,
            manufacturer VARCHAR(100),
            name VARCHAR(100),
            code VARCHAR(50),
            protocol VARCHAR(50)
          );
          CREATE TABLE public.fleet_vehicle (id BIGINT PRIMARY KEY);
          "
      - name: Provision the single application role and PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -f sql/0000_roles.sql
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -c "ALTER ROLE sana_user PASSWORD 'sana-test';"
      - name: Apply GPS schema as sana_user owner
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -f sql/0001_gps_schema.sql
      - name: Install protocol registration function
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -f sql/0002_detected_protocol_registration.sql
      - name: Install purge function and remove legacy roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -f sql/0003_purge_device_telemetry.sql
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -f sql/0004_remove_legacy_roles.sql
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -f sql/0006_drop_legacy_cluster_roles.sql
      - name: Verify single-role permissions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -c "
          DO \$\$
          BEGIN
            IF NOT has_column_privilege('sana_user', 'public.fleet_device', 'protocol', 'UPDATE') THEN
              RAISE EXCEPTION 'sana_user is missing UPDATE on fleet_device.protocol';
            END IF;
            IF NOT has_function_privilege('sana_user', 'gps.register_detected_device_protocol(bigint,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'sana_user is missing EXECUTE on the protocol registration function';
            END IF;
            IF NOT has_table_privilege('sana_user', 'gps.location_history', 'DELETE') THEN
              RAISE EXCEPTION 'sana_user is missing DELETE on location_history';
            END IF;
            IF NOT has_table_privilege('sana_user', 'gps.raw_packet', 'SELECT') THEN
              RAISE EXCEPTION 'sana_user is missing SELECT on raw_packet';
            END IF;
            IF NOT has_table_privilege('sana_user', 'gps.current_state', 'UPDATE') THEN
              RAISE EXCEPTION 'sana_user is missing UPDATE on current_state';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('sana_owner', 'sana_migrator', 'sana_backend', 'sana_gps', 'sana_gps_test')) THEN
              RAISE EXCEPTION 'Legacy SANA PostgreSQL roles still exist';
            END IF;
          END
          \$\$;
          "

      - name: Seed one business-owned device
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -c "
          INSERT INTO public.fleet_device
            (id, imei, management_status, protocol, device_model_id)
          VALUES (1, '352094082143253', 'active', 'teltonika', NULL);
          SELECT setval(pg_get_serial_sequence('public.fleet_device', 'id'), (SELECT max(id) FROM public.fleet_device));
          "
      - name: Verify restricted protocol auto-registration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -c "
          INSERT INTO public.fleet_devicemodel (id, manufacturer, name, code, protocol)
          VALUES (1, 'Test', 'Future model', 'future-model', 'future-protocol');
          INSERT INTO public.fleet_device (id, imei, management_status, protocol, device_model_id)
          VALUES
            (2, '352094082143254', 'warehouse', '', 1),
            (3, '352094082143255', 'warehouse', '', NULL);
          SELECT setval(pg_get_serial_sequence('public.fleet_device', 'id'), (SELECT max(id) FROM public.fleet_device));
          "
          PGPASSWORD=sana-test psql -h 127.0.0.1 -U sana_user -d sana_test -v ON_ERROR_STOP=1 -c "
          SELECT gps.register_detected_device_protocol(1, 'teltonika');
          SELECT gps.register_detected_device_protocol(1, 'gt06');
          SELECT gps.register_detected_device_protocol(2, 'future-protocol');
          SELECT gps.register_detected_device_protocol(2, 'teltonika');
          SELECT gps.register_detected_device_protocol(3, 'new-protocol');
          "
          psql -h 127.0.0.1 -U postgres -d sana_test -v ON_ERROR_STOP=1 -c "
          DO \$\$
          BEGIN
            IF (SELECT protocol FROM public.fleet_device WHERE id = 2) <> 'future-protocol' THEN
              RAISE EXCEPTION 'Detected protocol was not persisted for the model-compatible device';
            END IF;
            IF (SELECT protocol FROM public.fleet_device WHERE id = 3) <> 'new-protocol' THEN
              RAISE EXCEPTION 'Generic future protocol was not persisted';
            END IF;
            IF (SELECT protocol FROM public.fleet_device WHERE id = 1) <> 'teltonika' THEN
              RAISE EXCEPTION 'Existing device protocol was overwritten';
            END IF;
          END
          \$\$;
          "
      - name: Verify GPS persistence against PostgreSQL and PostGIS
        env:
          SANA_GPS_TEST_DSN: postgresql://sana_user:sana-test@127.0.0.1:5432/sana_test
          SANA_GPS_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sana_test
        run: python -m pytest -q tests/test_gps_postgres_integration.py
