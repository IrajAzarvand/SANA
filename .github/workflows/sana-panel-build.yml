name: SANA Panel Build

on:
  pull_request:
    paths:
      - "sana-panel/**"
      - ".github/workflows/sana-panel-build.yml"
  push:
    branches: [main]
    paths:
      - "sana-panel/**"
      - ".github/workflows/sana-panel-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sana-panel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sana-panel/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build panel
        run: npm run build
